name: P08 Billing Calculator

on:
  pull_request:
    branches: [main]
    paths:
      - backend/services/billing/**
      - .github/workflows/p08-billing-calculator.yml
  push:
    branches: [feat/billing-calculator]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  calculator-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements-test.txt
            backend/services/billing/requirements.txt
      - name: Install billing unit dependencies
        run: |
          python -m pip install -r requirements-test.txt
          python -m pip install -r backend/services/billing/requirements.txt
      - name: Compile billing code
        run: python -m compileall -q backend/services/billing
      - name: Run P08 cases with explicit calculator coverage gate
        working-directory: backend/services/billing
        run: python -m pytest tests/test_service.py -q --cov=app.calculator --cov-report=term-missing --cov-fail-under=80
