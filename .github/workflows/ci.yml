name: Backend CI (V3 schema + demo seed)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CI-only testing dependencies
        run: python -m pip install 'pytest>=8,<10' 'PyYAML>=6,<7'
      - name: Compile Python files
        run: python -m compileall -q backend scripts simulator
      - name: Validate YAML files
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          # Docker Compose supports custom YAML tags.
          # PyYAML needs explicit constructors for validation.
          def compose_tag(loader, tag_suffix, node):
              if isinstance(node, yaml.SequenceNode):
                  return loader.construct_sequence(node)
              if isinstance(node, yaml.MappingNode):
                  return loader.construct_mapping(node)
              return loader.construct_scalar(node)

          yaml.SafeLoader.add_multi_constructor("!", compose_tag)
          required = [Path('compose.yaml'), Path('infra/compose/dev.yaml'), Path('compose.prod.yaml'), Path('infra/compose/seed.yaml'), Path('infra/compose/tests/auth-unit.yaml'), Path('infra/compose/tests/room-unit-and-db.yaml'), Path('infra/compose/tests/room-meter-unit.yaml'), Path('infra/compose/tests/tenant-unit.yaml'), Path('infra/compose/tests/room-tenant-contracts.yaml'), Path('infra/compose/tests/contract-lifecycle.yaml'), Path('infra/compose/tests/mqtt-unit.yaml'), Path('infra/compose/tests/mqtt-telemetry.yaml'), Path('.github/workflows/ci.yml')]
          for path in required:
              assert path.exists(), f'Missing {path}'
              yaml.safe_load(path.read_text(encoding='utf-8'))
              print('Parsed', path)
          for path in (Path('contracts/openapi.yaml'), Path('contracts/asyncapi.yaml')):
              if path.exists() and path.stat().st_size:
                  yaml.safe_load(path.read_text(encoding='utf-8'))
                  print('Parsed',path)
          PY
      - name: Test deterministic seed dataset
        run: python -m pytest -q scripts/seed/tests
      - name: Ensure Room OpenAPI extensions are committed
        run: python scripts/room/sync_openapi.py --check contracts/openapi.yaml

  service-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: static-checks
    strategy:
      fail-fast: false
      matrix:
        service: [auth, room, tenant, metering, billing, notification]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/auth/requirements.txt
            backend/services/*/requirements.txt
      - name: Install backend test dependencies
        shell: bash
        run: |
          if [[ "${{ matrix.service }}" == "auth" ]]; then path="backend/auth"; else path="backend/services/${{ matrix.service }}"; fi
          python -m pip install -r requirements-test.txt
          python -m pip install -r "$path/requirements.txt"
      - name: Run actual service tests when implemented
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ matrix.service }}" == "auth" ]]; then path="backend/auth"; else path="backend/services/${{ matrix.service }}"; fi
          cd "$path"
          if grep -r -E -q '^[[:space:]]*(async[[:space:]]+)?def[[:space:]]+test_' tests --include='test_*.py'; then
            if [[ "${{ matrix.service }}" == "auth" || "${{ matrix.service }}" == "room" ]]; then
              python -m pytest tests -q --cov=app --cov-report=term-missing --cov-fail-under=95
            elif [[ "${{ matrix.service }}" == "billing" ]]; then
              python -m pytest tests -q --cov=app.calculator --cov-report=term-missing --cov-fail-under=80
            elif grep -E -q '^[[:space:]]*(async[[:space:]]+)?def[[:space:]]+test_' tests/test_service.py; then
              python -m pytest tests -q --cov=app.service --cov-report=term-missing --cov-fail-under=80
            else
              python -m pytest tests -q
              echo 'No service-level unit tests yet; 80% business logic gate not activated.'
            fi
          else
            echo 'NO SERVICE TESTS YET for ${{ matrix.service }}; this is not proof of unit coverage.'
          fi

  database-and-seed:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: static-checks
    env:
      SEED_MODE: demo
      SEED_OWNER_PASSWORD: CI_Demo_Only_Change_For_Local_2026
    steps:
      - uses: actions/checkout@v4
      - name: Create throwaway CI environment, never use real .env
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=ci_pg_local_only
          AUTH_DB_PASSWORD=ci_auth_local_only
          ROOM_DB_PASSWORD=ci_room_local_only
          TENANT_DB_PASSWORD=ci_tenant_local_only
          METERING_DB_PASSWORD=ci_metering_local_only
          BILLING_DB_PASSWORD=ci_billing_local_only
          NOTIFICATION_DB_PASSWORD=ci_notification_local_only
          RABBITMQ_DEFAULT_USER=ci_rabbit
          RABBITMQ_DEFAULT_PASS=ci_rabbit_local_only
          SERVICE_TOKEN=ci_service_token_local_only
          JWT_SECRET=ci_jwt_local_only_at_least_32_chars
          OWNER_EMAIL=owner.demo@example.com
          EOF
      - name: Validate Compose configuration
        run: docker compose -f compose.yaml -f infra/compose/seed.yaml config --quiet
      - name: Start PostgreSQL only
        run: docker compose up -d --wait postgres
      - name: Build six independent service images
        run: docker compose build auth room tenant metering billing notification
      - name: Run all six migrations
        run: |
          set -euo pipefail
          for svc in auth room tenant metering billing notification; do
            docker compose run --rm --no-deps "$svc" python -m alembic upgrade head
          done
      - name: Seed all six logical databases
        run: |
          set -euo pipefail
          for svc in auth room tenant metering billing notification; do
            docker compose -f compose.yaml -f infra/compose/seed.yaml run --rm --no-deps "$svc" python /seed/seed_service.py "$svc"
          done
      - name: Verify seed content and references
        run: |
          set -euo pipefail
          for svc in auth room tenant metering billing notification; do
            docker compose -f compose.yaml -f infra/compose/seed.yaml run --rm --no-deps "$svc" python /seed/verify_service.py "$svc"
          done
      - name: Verify PostgreSQL UNIQUE and exclusion constraints (rollback-only)
        run: |
          set -euo pipefail
          for svc in room tenant metering billing; do
            docker compose -f compose.yaml -f infra/compose/seed.yaml run --rm --no-deps "$svc" python /seed/verify_constraints.py "$svc"
          done
      - name: Verify room_v3_003 hierarchy immutability (rollback-only)
        run: |
          docker compose -f compose.yaml -f infra/compose/seed.yaml run --rm --no-deps room python /seed/verify_room_immutability.py
      - name: PostgreSQL P02 Room integration, real triggers and rollback (CI disposable DB)
        run: |
          set -euo pipefail
          docker compose -f compose.yaml -f infra/compose/tests/room-unit-and-db.yaml run --rm --no-deps room \
            sh -c 'python -m pip install --disable-pip-version-check -q -r /app/requirements-test.txt && python -m pytest integration/test_postgres.py -q'
      - name: Run seed again to prove idempotence
        run: |
          set -euo pipefail
          for svc in auth room tenant metering billing notification; do
            docker compose -f compose.yaml -f infra/compose/seed.yaml run --rm --no-deps "$svc" python /seed/seed_service.py "$svc" --expect-existing
          done
          for svc in auth room tenant metering billing notification; do
            docker compose -f compose.yaml -f infra/compose/seed.yaml run --rm --no-deps "$svc" python /seed/verify_service.py "$svc"
          done
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs postgres --tail=120
      - name: Stop test environment
        if: always()
        run: docker compose down -v --remove-orphans

  # Separate GitHub-hosted runner => new Docker volumes, no existing Alembic state.
  # This tests the REAL Compose startup dependency graph, not just run --no-deps.
  compose-startup-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: static-checks
    steps:
      - uses: actions/checkout@v4
      - name: Generate isolated CI-only credentials
        shell: bash
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=ci_pg_smoke_local_only
          AUTH_DB_PASSWORD=ci_auth_smoke_local_only
          ROOM_DB_PASSWORD=ci_room_smoke_local_only
          TENANT_DB_PASSWORD=ci_tenant_smoke_local_only
          METERING_DB_PASSWORD=ci_metering_smoke_local_only
          BILLING_DB_PASSWORD=ci_billing_smoke_local_only
          NOTIFICATION_DB_PASSWORD=ci_notification_smoke_local_only
          RABBITMQ_DEFAULT_USER=ci_rabbit
          RABBITMQ_DEFAULT_PASS=ci_rabbit_smoke_local_only
          SERVICE_TOKEN=ci_service_token_smoke_local_only
          JWT_SECRET=ci_jwt_smoke_local_only_at_least_32_chars
          OWNER_EMAIL=owner.demo@example.com
          EOF
      - name: Validate Compose
        env:
          PUBLIC_BASE_URL: https://rental.example.com
          SMTP_HOST: smtp.example.com
          SMTP_FROM: rental@example.com
          SMTP_USERNAME: ci-config-only
          SMTP_PASSWORD: ci-config-only
        run: |
          docker compose -f compose.yaml config --quiet
          docker compose -f compose.yaml -f compose.prod.yaml config --quiet
      - name: Boot the complete stack from new Docker volumes
        run: docker compose -f compose.yaml up -d --build
      - name: Inspect one-shot jobs, healthy apps, broker and Gateway
        shell: pwsh
        run: ./scripts/smoke_test.ps1 -Runtime -TimeoutSeconds 240
      - name: Validate live Nginx configuration
        run: docker compose -f compose.yaml exec -T nginx nginx -t
      - name: Seed disposable owner for real Auth / Gateway integration
        env:
          SEED_MODE: demo
          SEED_OWNER_PASSWORD: CI_Demo_Auth_Only_2026_Strong_Password
        run: docker compose -f compose.yaml -f infra/compose/seed.yaml run --rm --no-deps auth python /seed/seed_service.py auth
      - name: Test login, JWT and Nginx auth_request against real PostgreSQL
        env:
          TEST_AUTH_EMAIL: owner.demo@example.com
          TEST_AUTH_PASSWORD: CI_Demo_Auth_Only_2026_Strong_Password
        run: python3 scripts/auth/gateway_check.py
      - name: Test Room read-only routes via real Auth and Nginx
        env:
          TEST_AUTH_EMAIL: owner.demo@example.com
          TEST_AUTH_PASSWORD: CI_Demo_Auth_Only_2026_Strong_Password
        run: python3 scripts/room/gateway_check.py
      - name: Diagnose failed Compose startup
        if: failure()
        run: |
          docker compose -f compose.yaml ps -a || true
          docker compose -f compose.yaml logs --tail=140 || true
      - name: Destroy ONLY disposable GitHub CI volumes
        if: always()
        run: docker compose -f compose.yaml down -v --remove-orphans

  # P03: real RabbitMQ + two independent PostgreSQL logical databases.
  # Every CI run uses a disposable project, never a shared/local Docker volume.
  room-meter-events-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: static-checks
    steps:
      - uses: actions/checkout@v4
      - name: Write isolated P03 CI-only credentials
        shell: bash
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=p03_ci_pg_temporary
          AUTH_DB_PASSWORD=p03_ci_auth_temporary
          ROOM_DB_PASSWORD=p03_ci_room_temporary
          TENANT_DB_PASSWORD=p03_ci_tenant_temporary
          METERING_DB_PASSWORD=p03_ci_metering_temporary
          BILLING_DB_PASSWORD=p03_ci_billing_temporary
          NOTIFICATION_DB_PASSWORD=p03_ci_notification_temporary
          RABBITMQ_DEFAULT_USER=p03_ci_rabbit
          RABBITMQ_DEFAULT_PASS=p03_ci_rabbit_temporary
          SERVICE_TOKEN=p03_ci_service_token_is_long_enough
          JWT_SECRET=p03_ci_jwt_secret_is_long_enough
          OWNER_EMAIL=owner.demo@example.com
          EOF
      - name: Test actual Room outbox delivery, retry and Metering consumer
        shell: pwsh
        env:
          P03_CI_PROJECT_NAME: p03ci${{ github.run_id }}${{ github.run_attempt }}
        run: ./scripts/test_p03_integration.ps1
      - name: Inspect P03 failures
        if: failure()
        shell: bash
        env:
          P03_PROJECT_NAME: p03ci${{ github.run_id }}${{ github.run_attempt }}
        run: |
          docker compose -p "$P03_PROJECT_NAME" -f compose.yaml -f infra/compose/tests/room-meter-events.yaml ps -a || true
          docker compose -p "$P03_PROJECT_NAME" -f compose.yaml -f infra/compose/tests/room-meter-events.yaml logs --tail=120 || true

  # P04: Room REST + tenant_db PostgreSQL GiST EXCLUDE (two independent HTTP requests).
  # The PowerShell runner picks a disposable project starting p04ci.
  room-tenant-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: static-checks
    steps:
      - uses: actions/checkout@v4
      - name: Write isolated P04 CI-only credentials
        shell: bash
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=p04_ci_pg_temporary
          AUTH_DB_PASSWORD=p04_ci_auth_temporary
          ROOM_DB_PASSWORD=p04_ci_room_temporary
          TENANT_DB_PASSWORD=p04_ci_tenant_temporary
          METERING_DB_PASSWORD=p04_ci_metering_temporary
          BILLING_DB_PASSWORD=p04_ci_billing_temporary
          NOTIFICATION_DB_PASSWORD=p04_ci_notification_temporary
          RABBITMQ_DEFAULT_USER=p04_ci_rabbit
          RABBITMQ_DEFAULT_PASS=p04_ci_rabbit_temporary
          SERVICE_TOKEN=p04_ci_service_token_long_enough
          JWT_SECRET=p04_ci_jwt_secret_long_enough_123
          OWNER_EMAIL=owner.demo@example.com
          EOF
      - name: Real P04 Room + Tenant contract integration
        shell: pwsh
        env:
          P04_CI_PROJECT_NAME: p04ci${{ github.run_id }}${{ github.run_attempt }}
        run: ./scripts/test_p04_integration.ps1
      - name: Inspect failed isolated P04 stack
        if: failure()
        shell: bash
        env:
          P04_PROJECT_NAME: p04ci${{ github.run_id }}${{ github.run_attempt }}
        run: |
          docker compose -p "$P04_PROJECT_NAME" -f compose.yaml -f infra/compose/tests/room-tenant-contracts.yaml ps -a || true
          docker compose -p "$P04_PROJECT_NAME" -f compose.yaml -f infra/compose/tests/room-tenant-contracts.yaml logs --tail=100 || true

  # P05: disposable PostgreSQL + real RabbitMQ cross-service lifecycle tests.
  contract-lifecycle-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: static-checks
    steps:
      - uses: actions/checkout@v4
      - name: Write disposable P05 CI credentials
        shell: bash
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=p05_ci_pg_local_only
          AUTH_DB_PASSWORD=p05_ci_auth_local_only
          ROOM_DB_PASSWORD=p05_ci_room_local_only
          TENANT_DB_PASSWORD=p05_ci_tenant_local_only
          METERING_DB_PASSWORD=p05_ci_metering_local_only
          BILLING_DB_PASSWORD=p05_ci_billing_local_only
          NOTIFICATION_DB_PASSWORD=p05_ci_notification_local_only
          RABBITMQ_DEFAULT_USER=p05_ci_rabbit
          RABBITMQ_DEFAULT_PASS=p05_ci_rabbit_local_only
          SERVICE_TOKEN=p05_ci_service_token_32_char_test_only
          JWT_SECRET=p05_ci_jwt_secret_32_char_test_only
          OWNER_EMAIL=owner.demo@example.org
          EOF
      - name: Real Tenant lifecycle, Room occupancy and Metering cutoffs
        shell: pwsh
        env:
          P05_CI_PROJECT_NAME: p05ci${{ github.run_id }}${{ github.run_attempt }}
        run: ./scripts/test_p05_integration.ps1

  # P06: real MQTT QoS1 -> RabbitMQ MQTT plugin -> AMQP -> Metering -> Postgres.
  mqtt-metering-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: static-checks
    steps:
      - uses: actions/checkout@v4
      - name: Create temporary P06 CI-only credentials
        shell: bash
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=p06_ci_pg_local_only
          AUTH_DB_PASSWORD=p06_ci_auth_local_only
          ROOM_DB_PASSWORD=p06_ci_room_local_only
          TENANT_DB_PASSWORD=p06_ci_tenant_local_only
          METERING_DB_PASSWORD=p06_ci_metering_local_only
          BILLING_DB_PASSWORD=p06_ci_billing_local_only
          NOTIFICATION_DB_PASSWORD=p06_ci_notification_local_only
          RABBITMQ_DEFAULT_USER=p06_ci_rabbit
          RABBITMQ_DEFAULT_PASS=p06_ci_rabbit_local_only
          SERVICE_TOKEN=p06_ci_service_token_32_char_test_only
          JWT_SECRET=p06_ci_jwt_secret_32_char_test_only
          OWNER_EMAIL=owner.demo@example.org
          EOF
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Simulator unit tests
        shell: bash
        run: |
          python -m pip install -r simulator/requirements.txt 'pytest>=8,<10'
          (cd simulator && python -m pytest -q tests)
      - name: P06 real MQTT telemetry delivery and database consistency
        shell: pwsh
        env:
          P06_CI_PROJECT_NAME: p06ci${{ github.run_id }}${{ github.run_attempt }}
        run: ./scripts/test_p06_integration.ps1
