name: P09 Billing Invoices

on:
  pull_request:
    branches: [main]
    paths:
      - backend/services/billing/**
      - backend/services/tenant/**
      - backend/services/metering/**
      - infra/rabbitmq/**
      - tests/integration/test_contract_billing.py
      - compose*.yaml
      - scripts/test_p09.ps1
      - .github/workflows/p09-billing-invoices.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  invoices:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Run P08 unit and P09 integration tests
        shell: pwsh
        run: ./scripts/test_p09.ps1
