name: MoMo Payments

on:
  pull_request:
    branches: [main]
    paths:
      - backend/services/billing/**
      - backend/services/notification/**
      - infra/nginx/**
      - infra/rabbitmq/**
      - tests/integration/test_momo_payment.py
      - compose*.yaml
      - infra/compose/**
      - scripts/test_p11.ps1
      - .github/workflows/momo-payment.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  email:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Verify payment IPN, reconciliation and RabbitMQ outbox
        shell: pwsh
        run: ./scripts/test_p11.ps1
