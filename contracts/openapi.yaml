          application/json:
            schema:
              $ref: '#/components/schemas/auth__LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/auth__LoginResponse'
        '422':
          description: Request validation failed
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - correlation_id
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  correlation_id:
                    type: string
        default:
          description: Domain, authentication or dependency error; inspect HTTP status and response body.
          content:
            application/json:
              schema:
                type: object
                required:
                - code
                - message
                - correlation_id
                properties:
                  code:
                    type: string
                  message:
                    type: string
                  correlation_id:
                    type: string
