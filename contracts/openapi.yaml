openapi: 3.1.0
info:
  title: Rental Management - HTTP API Contracts
  version: 1.2.0
  description: HTTP contract aligned with registered backend routes. Owner APIs use JWT through Nginx. Internal
    APIs use service credentials on the Docker network and are blocked at the gateway. Invoice periods are [start,
    end); contract end_date is inclusive. Regenerate and check each service with scripts/check_api_contract.py.
    Operation count is not a claim of complete business-scenario test coverage.
servers:
- url: http://localhost:8080
  description: Public API Gateway local
tags:
- name: Auth
- name: Room
- name: Tenant
- name: Metering
- name: Billing
- name: Notification
- name: Operations
