  /webhooks/momo/ipn:
    post:
      tags:
      - Public
      summary: MoMo callback thông báo kết quả thanh toán
      operationId: public_post_webhooks_momo_ipn
      description: Xác minh HMAC theo tài liệu tích hợp MoMo Sandbox đang sử dụng, dùng raw data canonical theo
        MoMo; kiểm tra orderId, amount, payment status; idempotent + đối soát. Không tin redirect từ trình duyệt.
        Cấu trúc request là subset thực tế dùng cho validation; đối chiếu với tài liệu MoMo trước triển khai. Theo
        tài liệu MoMo Payment Notification, callback IPN được đáp 204 No Content. Payload bên dưới là subset các
        trường cốt lõi; responseTime/orderInfo/orderType/payType/extraData có thể cần để xác minh HMAC. Nếu IPN
        đến muộn, vẫn đối chiếu với payment_attempt và đưa vào quy trình đối soát, không tự bỏ qua chỉ vì status
        tạm thời EXPIRED.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                partnerCode: *id001
                orderId: *id001
                requestId: *id001
                amount:
                  type: integer
                resultCode:
                  type: integer
                transId:
                  type: integer
                message: *id001
                signature: *id001
                orderInfo:
                  type: string
                orderType:
                  type: string
                payType:
                  type: string
                responseTime:
                  type: integer
                  format: int64
                extraData:
                  type: string
              required:
              - partnerCode
              - orderId
              - requestId
              - amount
              - resultCode
              - signature
      responses:
        '400':
          description: Dữ liệu không hợp lệ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Chưa xác thực
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Không đủ quyền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Không tồn tại
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Xung đột nghiệp vụ / ràng buộc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Dữ liệu không thỏa điều kiện
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Phụ thuộc nội bộ chưa sẵn sàng
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '204':
