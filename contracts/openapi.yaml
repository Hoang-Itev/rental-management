  /api/v1/final-invoices:
    post:
      tags:
      - Billing
      summary: Lập hóa đơn quyết toán cho phần còn lại khi hợp đồng kết thúc
      operationId: billing_post_api_v1_final_invoices
      description: Chỉ hợp đồng ENDED. Billing đọc context từ Tenant và các cutoff CONTRACT_END/MONTHLY từ Metering.
        Chỉ tính phần chưa phủ bởi hóa đơn PERIODIC hoặc FINAL chưa VOID. Tạo DRAFT nếu thiếu chỉ số; idempotent
        theo contract. Job hàng tháng cũng có thể phát FINAL thay PERIODIC cho tháng kết thúc. Thời gian invoice
        dùng [period_start, period_end) (mốc cuối không bao gồm); không dùng end_date + 1 trong constraint invoices.
        Hóa đơn FINAL không được tính trùng phần đã có hóa đơn.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FinalInvoiceRequest'
      responses:
        '201':
          description: Tạo hóa đơn FINAL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invoice'
        '409':
          description: Chưa đủ điều kiện hoặc không còn khoản nào chưa tính
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /api/v1/jobs/payments/reconcile/run:
    post:
      tags:
      - Billing
      summary: Chạy đối soát các giao dịch MoMo PENDING (admin/demo)
      operationId: billing_run_payment_reconciliation
      description: Đối soát MoMo PENDING theo phiên hoặc theo nhóm. Nếu trạng thái chưa rõ, giữ PENDING. Không sửa
        hóa đơn nếu chưa xác minh giao dịch.
      security:
      - BearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                payment_attempt_id:
                  type: string
                  format: uuid
                  description: Tùy chọn, đối soát đúng một attempt
                limit:
                  type: integer
                  minimum: 1
                  maximum: 100
                  default: 50
              additionalProperties: false
      responses:
        '200':
          description: Kết quả đối soát
          content:
            application/json:
              schema:
                type: object
                properties:
                  checked_count:
                    type: integer
                    minimum: 0
                  succeeded_count:
                    type: integer
                    minimum: 0
                  failed_count:
                    type: integer
                    minimum: 0
                  still_pending_count:
                    type: integer
                    minimum: 0
                required:
                - checked_count
                - succeeded_count
                - failed_count
                - still_pending_count
        '400': &id008
          description: Lỗi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401': *id008
        '403': *id008
        '503': *id008
