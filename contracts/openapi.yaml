openapi: 3.1.0
info:
  title: Rental Management - HTTP API Contracts
  version: 1.1.0
  description: Thiết kế V1.1 từ Database V3 (26 bảng). Các đường dẫn /api/v1 và /public/v1 đi qua API Gateway; /internal/v1
    chỉ trong Docker network. Mỗi microservice chỉ truy cập DB của mình. Không phải mã ứng dụng đã triển khai. Quy
    ước khoảng hóa đơn [start, end), nhưng end_date hợp đồng là ngày cuối được thuê. Phiên bản này bổ sung MoMo
    reconciliation, retry jobs, hạn chế token trong access logs và thống nhất khoảng hóa đơn [start,end).
servers:
- url: http://localhost:8080
  description: Public API Gateway local
