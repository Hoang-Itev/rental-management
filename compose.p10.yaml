services:
  billing:
    environment:
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      INVOICE_LINK_TTL_SECONDS: ${INVOICE_LINK_TTL_SECONDS:-259200}

  notification-worker:
    build: ./backend/services/notification
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    networks: [internal]
    depends_on:
      notification:
        condition: service_healthy
      billing:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql+psycopg://notification_app:${NOTIFICATION_DB_PASSWORD}@postgres:5432/notification_db
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
      BILLING_URL: ${NOTIFICATION_BILLING_URL:-http://billing:8000}
      SERVICE_TOKEN: ${SERVICE_TOKEN:?Set SERVICE_TOKEN in .env}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_SECURITY: ${SMTP_SECURITY:-plain}
      SMTP_FROM: ${SMTP_FROM:-billing@example.com}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      NOTIFICATION_POLL_SECONDS: ${NOTIFICATION_POLL_SECONDS:-2}
      NOTIFICATION_RETRY_SECONDS: ${NOTIFICATION_RETRY_SECONDS:-30}
      NOTIFICATION_MAX_ATTEMPTS: ${NOTIFICATION_MAX_ATTEMPTS:-5}
      NOTIFICATION_TIMEOUT_SECONDS: ${NOTIFICATION_TIMEOUT_SECONDS:-8}
