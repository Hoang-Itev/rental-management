
# Rendered by official nginx Docker envsubst.
# Never log URI because public invoice URLs may contain bearer tokens.
# SERVICE_TOKEN comes from Compose environment, never committed.

limit_req_zone $binary_remote_addr zone=auth_login:10m rate=10r/m;

log_format safe '$remote_addr [$time_local] $request_method $status '
                '$body_bytes_sent $request_time';

map $http_x_correlation_id $correlation_id {
    default $http_x_correlation_id;
    "" $request_id;
}

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log safe;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-ID $correlation_id;

    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    client_max_body_size 2m;

    # Authentication through Auth Service.
    # Never trust a client-supplied X-Auth-User-Id.
    auth_request /_auth;
    auth_request_set $verified_user_id $upstream_http_x_auth_user_id;
    proxy_set_header X-Auth-User-Id $verified_user_id;

    # Consistent JSON errors generated by Nginx itself.
    # Upstream FastAPI error bodies remain unchanged because
    # proxy_intercept_errors is disabled by default.
    error_page 401 = @json_unauthorized;
    error_page 429 = @json_rate_limited;

    location @json_unauthorized {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 401 '{"detail":"Not authenticated"}';
    }

    location @json_rate_limited {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 429 '{"detail":"Too many requests"}';
    }

    # Internal endpoint used only by Nginx auth_request.
    location = /_auth {
        internal;
        auth_request off;

        proxy_pass http://auth:8000/internal/v1/auth/verify;

        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Service-Token "${SERVICE_TOKEN}";
    }

    # Public gateway health check.
    location = /gateway-health {
        auth_request off;
        default_type text/plain;
        return 200 "nginx gateway ready\n";
    }

    # Public login with IP-based rate limiting.
    location = /api/v1/auth/login {
        auth_request off;

        limit_req zone=auth_login burst=8 nodelay;
        limit_req_status 429;

        proxy_pass http://auth:8000;
    }

    # Other Auth endpoints require a valid JWT.
    location /api/v1/auth/ {
        proxy_pass http://auth:8000;
    }

    # Metering route must precede the generic rooms route.
    location ~ ^/api/v1/rooms/[^/]+/meters(?:/|$) {
        proxy_pass http://metering:8000;
    }

    # Room Service.
    location ~ ^/api/v1/(properties|buildings|floors|rooms)(/|$) {
        proxy_pass http://room:8000;
    }

    # Tenant Service.
    location ~ ^/api/v1/(tenants|contracts)(/|$) {
        proxy_pass http://tenant:8000;
    }

    location /api/v1/jobs/contracts/ {
        proxy_pass http://tenant:8000;
    }

    # Metering Service.
    location ~ ^/api/v1/(meters|meter-cutoffs|meter-alerts)(/|$) {
        proxy_pass http://metering:8000;
    }

    location /api/v1/jobs/meters/ {
        proxy_pass http://metering:8000;
    }

    # Billing Service.
    location ~ ^/api/v1/(invoices|invoice-adjustments|billing-runs|final-invoices)(/|$) {
        proxy_pass http://billing:8000;
    }

    location /api/v1/jobs/payments/ {
        proxy_pass http://billing:8000;
    }

    # Notification Service.
    location /api/v1/email-jobs {
        proxy_pass http://notification:8000;
    }

    # Public invoice access uses its own bearer token.
    location /public/v1/invoices/ {
        auth_request off;

        limit_except GET POST {
            deny all;
        }

        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;

        proxy_pass http://billing:8000;
    }

    # Public MoMo webhook.
    location = /webhooks/momo/ipn {
        auth_request off;

        limit_except POST {
            deny all;
        }

        proxy_pass http://billing:8000;
    }

    # Never expose internal APIs directly.
    location ^~ /internal/ {
        return 404;
    }

    # Reject unknown API routes.
    location /api/ {
        return 404;
    }

    # Frontend placeholder until React is implemented.
    location / {
        auth_request off;

        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
