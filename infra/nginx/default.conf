# Rendered by official nginx Docker envsubst. Never log URI (invoice bearer links).
# SERVICE_TOKEN comes from Compose env, never committed.
limit_req_zone $binary_remote_addr zone=auth_login:10m rate=10r/m;

log_format safe '$remote_addr [$time_local] $request_method $status '
                '$body_bytes_sent $request_time';

map $http_x_correlation_id $correlation_id {
    default $http_x_correlation_id;
    "" $request_id;
}

server {
    listen 80;
    server_name _;
    access_log /var/log/nginx/access.log safe;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-ID $correlation_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    client_max_body_size 2m;

    # Never trust a client-supplied X-Auth-User-Id. Use the Auth subrequest.
    auth_request /_auth;
    auth_request_set $verified_user_id $upstream_http_x_auth_user_id;
    proxy_set_header X-Auth-User-Id $verified_user_id;

    location = /_auth {
        internal;
        auth_request off;
        proxy_pass http://auth:8000/internal/v1/auth/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Service-Token "${SERVICE_TOKEN}";
    }

    location = /gateway-health {
        auth_request off;
        default_type text/plain;
        return 200 "nginx gateway ready\n";
    }

    location = /api/v1/auth/login {
        auth_request off;
        limit_req zone=auth_login burst=8 nodelay;
        limit_req_status 429;
        proxy_pass http://auth:8000;
    }
    location /api/v1/auth/ { proxy_pass http://auth:8000; }

    location ~ ^/api/v1/rooms/[^/]+/meters(?:/|$) {
        proxy_pass http://metering:8000;
    }
    location ~ ^/api/v1/(properties|buildings|floors|rooms)(/|$) {
        proxy_pass http://room:8000;
    }
    location ~ ^/api/v1/(tenants|contracts)(/|$) {
        proxy_pass http://tenant:8000;
    }
    location /api/v1/jobs/contracts/ { proxy_pass http://tenant:8000; }
    location ~ ^/api/v1/(meters|meter-cutoffs|meter-alerts)(/|$) {
        proxy_pass http://metering:8000;
    }
    location /api/v1/jobs/meters/ { proxy_pass http://metering:8000; }
    location ~ ^/api/v1/(invoices|invoice-adjustments|billing-runs|final-invoices)(/|$) {
        proxy_pass http://billing:8000;
    }
    location /api/v1/jobs/payments/ { proxy_pass http://billing:8000; }
    location /api/v1/email-jobs { proxy_pass http://notification:8000; }

    location /public/v1/invoices/ {
        auth_request off;
        limit_except GET POST { deny all; }
        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;
        proxy_pass http://billing:8000;
    }
    location = /webhooks/momo/ipn {
        auth_request off;
        limit_except POST { deny all; }
        proxy_pass http://billing:8000;
    }

    location ^~ /internal/ { return 404; }
    location /api/ { return 404; }

    # FE placeholder until React is built.
    location / {
        auth_request off;
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
