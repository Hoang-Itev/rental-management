
# Rendered by official nginx Docker envsubst.
# Never log URI because public invoice URLs may contain bearer tokens.
# SERVICE_TOKEN comes from Compose environment, never committed.
# Requires Nginx >= 1.27.3 for open-source upstream DNS re-resolution.

limit_req_zone $binary_remote_addr zone=auth_login:10m rate=10r/m;

log_format safe '$remote_addr [$time_local] $request_method $status '
                '$body_bytes_sent $request_time';

map $http_x_correlation_id $correlation_id {
    default $http_x_correlation_id;
    "" $request_id;
}

# Docker DNS: automatically refresh backend IPs.
resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 3s;

# Dynamic upstreams with shared memory.
upstream auth_backend {
    zone auth_backend 64k;
    server auth:8000 resolve;
}

upstream room_backend {
    zone room_backend 64k;
    server room:8000 resolve;
}

upstream tenant_backend {
    zone tenant_backend 64k;
    server tenant:8000 resolve;
}

upstream metering_backend {
    zone metering_backend 64k;
    server metering:8000 resolve;
}

upstream billing_backend {
    zone billing_backend 64k;
    server billing:8000 resolve;
}

upstream notification_backend {
    zone notification_backend 64k;
    server notification:8000 resolve;
}

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log safe;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Correlation-ID $correlation_id;

    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    client_max_body_size 2m;

    # Authentication and verified identity propagation.
    auth_request /_auth;
    auth_request_set $verified_user_id $upstream_http_x_auth_user_id;
    proxy_set_header X-Auth-User-Id $verified_user_id;

    # JSON responses for errors generated by Nginx.
    error_page 401 = @json_unauthorized;
    error_page 429 = @json_rate_limited;

    location @json_unauthorized {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 401 '{"detail":"Not authenticated"}';
    }

    location @json_rate_limited {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 429 '{"detail":"Too many requests"}';
    }

    # Internal authentication subrequest.
    location = /_auth {
        internal;
        auth_request off;

        # Map /_auth to the real Auth verify endpoint.
        proxy_pass http://auth_backend/internal/v1/auth/verify;

        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Service-Token "${SERVICE_TOKEN}";
    }

    location = /gateway-health {
        auth_request off;
        default_type text/plain;
        return 200 "nginx gateway ready\n";
    }

    # Public login with rate limiting.
    location = /api/v1/auth/login {
        auth_request off;

        limit_req zone=auth_login burst=8 nodelay;
        limit_req_status 429;

        proxy_pass http://auth_backend;
    }

    location /api/v1/auth/ {
        proxy_pass http://auth_backend;
    }

    # Metering route must precede generic Room routing.
    location ~ ^/api/v1/rooms/[^/]+/meters(?:/|$) {
        proxy_pass http://metering_backend;
    }

    # Room Service.
    location ~ ^/api/v1/(properties|buildings|floors|rooms)(/|$) {
        proxy_pass http://room_backend;
    }

    # Tenant Service.
    location ~ ^/api/v1/(tenants|contracts)(/|$) {
        proxy_pass http://tenant_backend;
    }

    location /api/v1/jobs/contracts/ {
        proxy_pass http://tenant_backend;
    }

    # Metering Service.
    location ~ ^/api/v1/(meters|meter-cutoffs|meter-alerts)(/|$) {
        proxy_pass http://metering_backend;
    }

    location /api/v1/jobs/meters/ {
        proxy_pass http://metering_backend;
    }

    # Billing Service.
    location ~ ^/api/v1/(invoices|invoice-adjustments|billing-runs|final-invoices)(/|$) {
        proxy_pass http://billing_backend;
    }

    location /api/v1/jobs/payments/ {
        proxy_pass http://billing_backend;
    }

    # Notification Service.
    location /api/v1/email-jobs {
        proxy_pass http://notification_backend;
    }

    # Public invoice links.
    location /public/v1/invoices/ {
        auth_request off;

        limit_except GET POST {
            deny all;
        }

        add_header Referrer-Policy "no-referrer" always;
        add_header Cache-Control "no-store" always;

        proxy_pass http://billing_backend;
    }

    # MoMo payment webhook.
    location = /webhooks/momo/ipn {
        auth_request off;

        limit_except POST {
            deny all;
        }

        proxy_pass http://billing_backend;
    }

    # Block internal API access from clients.
    location ^~ /internal/ {
        return 404;
    }

    location /api/ {
        return 404;
    }

    # React frontend placeholder.
    location / {
        auth_request off;

        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
