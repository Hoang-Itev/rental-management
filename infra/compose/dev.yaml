# Optional hot-reload overlay for local development.
# Run: docker compose -f compose.yaml -f infra/compose/dev.yaml up -d --build
services:
  auth:
    ports:
      - "127.0.0.1:18000:8000"
    volumes:
      - ./backend/auth/app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
  room:
    ports:
      - "127.0.0.1:18001:8000"
    volumes:
      - ./backend/services/room/app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
  tenant:
    ports:
      - "127.0.0.1:18002:8000"
    volumes:
      - ./backend/services/tenant/app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
  metering:
    ports:
      - "127.0.0.1:18003:8000"
    volumes:
      - ./backend/services/metering/app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
  billing:
    ports:
      - "127.0.0.1:18004:8000"
    volumes:
      - ./backend/services/billing/app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--no-access-log"]
  notification:
    ports:
      - "127.0.0.1:18005:8000"
    volumes:
      - ./backend/services/notification/app:/app/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
