# For randomized isolated test project only. Docker Compose v2.24+ !reset tag.
services:
  rabbitmq:
    ports: !reset []
  room:
    volumes:
      - ./tests/integration/test_room_outbox_publish.py:/app/integration/test_room_outbox_publish.py:ro
      - ./requirements-test.txt:/app/requirements-test.txt:ro
    environment:
      ROOM_P03_EPHEMERAL_TEST: "1"
      P03_PROJECT_NAME: ${P03_PROJECT_NAME:?Set randomized P03_PROJECT_NAME}
  metering:
    volumes:
      - ./tests/integration/test_room_meter_events.py:/app/integration/test_room_meter_events.py:ro
      - ./requirements-test.txt:/app/requirements-test.txt:ro
    environment:
      P03_EPHEMERAL_TEST: "1"
      P03_PROJECT_NAME: ${P03_PROJECT_NAME:?Set randomized P03_PROJECT_NAME}
      ROOM_DATABASE_URL: postgresql+psycopg://room_app:${ROOM_DB_PASSWORD:?ROOM_DB_PASSWORD required}@postgres:5432/room_db
