x-momo: &momo
  MOMO_PARTNER_CODE: ${MOMO_PARTNER_CODE:-}
  MOMO_ACCESS_KEY: ${MOMO_ACCESS_KEY:-}
  MOMO_SECRET_KEY: ${MOMO_SECRET_KEY:-}
  MOMO_IPN_URL: ${MOMO_IPN_URL:-}
  MOMO_TIMEOUT_SECONDS: ${MOMO_TIMEOUT_SECONDS:-30}
  MOMO_RECONCILE_SECONDS: ${MOMO_RECONCILE_SECONDS:-300}
  PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}

services:
  billing:
    environment: *momo
  billing-scheduler:
    environment: *momo
