# P06 MQTT telemetry. Merge AFTER compose.yaml, compose.p03.yaml, compose.p05.yaml.
# Simulator already exists behind the `simulator` profile in compose.yaml.
services:
  metering-telemetry-consumer:
    build: ./backend/services/metering
    command: ["python", "-m", "app.worker", "telemetry"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://metering_app:${METERING_DB_PASSWORD:?Set METERING_DB_PASSWORD}@postgres:5432/metering_db
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:?Set RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS:?Set RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/
    depends_on:
      metering-migrate:
        condition: service_completed_successfully
      rabbitmq-init:
        condition: service_completed_successfully
    networks: [internal]
  simulator:
    restart: unless-stopped
    environment:
      SIM_INTERVAL_SECONDS: ${SIM_INTERVAL_SECONDS:-300}
      SIM_REFRESH_SECONDS: ${SIM_REFRESH_SECONDS:-300}
      SIM_EPOCH: ${SIM_EPOCH:-2026-01-01T00:00:00+00:00}
      SIM_TIME_SCALE: ${SIM_TIME_SCALE:-1}
      SIM_KWH_PER_DAY: ${SIM_KWH_PER_DAY:-4}
      SIM_M3_PER_DAY: ${SIM_M3_PER_DAY:-0.5}
    depends_on:
      metering:
        condition: service_healthy
      rabbitmq-init:
        condition: service_completed_successfully
