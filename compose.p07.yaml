# P07: Meter cutoff job. Compose -f compose.yaml -f compose.p03.yaml -f compose.p05.yaml -f compose.p06.yaml -f compose.p07.yaml
services:
  metering-cutoff-scheduler:
    build: ./backend/services/metering
    command: ["python", "-m", "app.scheduler"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://metering_app:${METERING_DB_PASSWORD:?METERING_DB_PASSWORD required}@postgres:5432/metering_db
      P07_JOB_INTERVAL_SECONDS: ${P07_JOB_INTERVAL_SECONDS:-60}
      P07_OFFLINE_MINUTES: ${P07_OFFLINE_MINUTES:-20}
      P07_MONTHS_BACK: ${P07_MONTHS_BACK:-24}
    depends_on:
      metering-migrate:
        condition: service_completed_successfully
    networks: [internal]
